<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Ruangan Kosong 1: Untuk Judul Halaman yang Berbeda-beda -->
    <title>{% block judul %}{{ artikel.judul }} | {{ nama_blog }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Komponen yang akan selalu muncul di semua halaman -->
    <header>
        <h2>🌐 Navigasi Blog Statis</h2>
        <nav>
            <!-- PERBAIKAN ARSITEKTUR: Menu Home akan menyala aktif jika berada di halaman '/' ATAU jika di dalam jalur URL terdapat kata '/blog/' -->
            <a 
                href="/" 
                class="nav-link {% if request.url.path == '/' or '/blog/' in request.url.path %}active{% endif %}">
                Home
            </a>
            
            <!-- Menu About tetap menggunakan pencocokan kaku karena merupakan halaman tunggal mandiri -->
            <a 
                href="/about" 
                class="nav-link {% if request.url.path == '/about' %}active{% endif %}">
                About
            </a>
        </nav>
        <hr>
    </header>
    <!-- Ruangan Kosong 2: Tempat Isi Konten Utama Setiap Halaman -->
    <main>
        {% block konten %}
        <!-- Isi artikel atau konten unik akan masuk ke sini -->
        {% endblock %}
    </main>

    <footer>
        <hr>
        <p>© 2026 Blog Statis Menakjubkan - Dibuat dengan FastAPI</p>
    </footer>
</body>
</html>
