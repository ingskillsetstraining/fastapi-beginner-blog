<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Ruangan Kosong 1: Untuk Judul Halaman yang Berbeda-beda -->
    <title>{% block judul %}Blog Statis Saya{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Komponen yang akan selalu muncul di semua halaman -->
    <header>
        <h2>🌐 Navigasi Blog Statis</h2>
        <!-- Pasang menu navigasi fisik menggunakan tag tautan HTML -->
        <nav>
            <!-- Tautan menuju Halaman Utama (Home) -->
            <a href="/" style="margin-right: 15px; text-decoration: none; color: black;">
                Home
            </a>
            
            <!-- Tautan menuju Halaman Profil (About) -->
            <a href="/about" style="text-decoration: none; color: black;">
                About
            </a>
        </nav>
        <hr>
    </header>

    <!-- Ruangan Kosong 2: Tempat Isi Konten Utama Setiap Halaman -->
    <main>
        {% block konten %}
        <!-- Isi artikel atau konten unik akan masuk ke sini -->
        {% endblock %}
    </main>

    <footer>
        <hr>
        <p>© 2026 Blog Statis Menakjubkan - Dibuat dengan FastAPI</p>
    </footer>
</body>
</html>
