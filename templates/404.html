{% extends 'base.html' %}

{% block konten %}

        <h1 style="font-size: 72px; color: navy; margin-bottom: 10px;">⚠️ 404</h1>
        <h2>Aduh! Halaman yang Anda Cari Tidak Ditemukan</h2>

        <a href="/" style="display: inline-block; padding: 10px 20px; background-color: navy; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">

        </a>
    </div>
{% endblock %}
